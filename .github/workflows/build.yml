name: Build CUDA wheels
on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
    inputs:
      torch:
        description: 'Optional stable PyTorch X.Y.Z (empty: discover new releases)'
        type: string
      only:
        description: 'Optional exact bundle ID (see plan artifact)'
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'scripts/**', 'config.json']
permissions:
  contents: read
concurrency:
  group: cuda-release-pipeline
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TORCH_VERSION: ${{ inputs.torch }}
          ONLY: ${{ inputs.only }}
        run: python scripts/plan.py --torch "$TORCH_VERSION" --only "$ONLY"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            plan.json
            catalog.json
          retention-days: 7
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Write build specification
        shell: bash
        env:
          SPEC: ${{ toJSON(matrix) }}
        run: python -c 'import os,pathlib; pathlib.Path("spec.json").write_text(os.environ["SPEC"])'
      - name: Reclaim hosted Linux runner disk
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: Restore compiler cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: .tmp/ccache
          key: ${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ matrix.id }}-
      - name: Build Linux in native NVIDIA development image
        if: runner.os == 'Linux'
        shell: bash
        env:
          CUDA_IMAGE: ${{ matrix.image }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          mkdir -p .tmp
          image="$CUDA_IMAGE"
          if [[ "$image" != *:* ]]; then image="nvidia/cuda:$image"; fi
          # Leave time to persist diagnostics/cache before the 6h hosted limit.
          timeout --signal=TERM --kill-after=120s 320m docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --workdir /workspace --env PYTHON_VERSION \
            "$image" bash scripts/linux.sh
      - name: Persist Linux compiler cache even after a failed attempt
        if: always() && runner.os == 'Linux'
        uses: actions/cache/save@v4
        with:
          path: .tmp/ccache
          key: ${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install Visual Studio 2019 for legacy CUDA
        if: runner.os == 'Windows' && (matrix.name == 'kepler30' || matrix.name == 'kepler')
        shell: pwsh
        env:
          LEGACY_COMPONENTS: ${{ matrix.name == 'kepler30' && '--add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041' || '' }}
        run: |
          choco install visualstudio2019buildtools --yes --no-progress --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools $env:LEGACY_COMPONENTS --includeRecommended --quiet --norestart"
          if ($LASTEXITCODE -notin @(0,3010)) { exit $LASTEXITCODE }
      - name: Verify legacy Windows SDK installation
        if: runner.os == 'Windows' && matrix.name == 'kepler30'
        shell: pwsh
        run: |
          # SDK 19041 is VS 2019's recommended SDK; retired 18362 may be skipped.
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          foreach ($file in @('include\10.0.19041.0\um\Windows.h', 'include\10.0.19041.0\ucrt\stdio.h', 'Lib\10.0.19041.0\um\x64\kernel32.lib')) {
            if (-not (Test-Path (Join-Path $sdk $file))) { throw "Windows SDK 19041 installation incomplete: $file" }
          }
      - name: Select MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: ${{ (matrix.name == 'kepler30' || matrix.name == 'kepler') && '2019' || '2022' }}
          toolset: ${{ matrix.name == 'kepler30' && '14.16' || '' }}
          sdk: ${{ matrix.name == 'kepler30' && '10.0.19041.0' || '' }}
      - name: Verify CUDA 10.2 host compiler
        if: runner.os == 'Windows' && matrix.name == 'kepler30'
        shell: pwsh
        run: |
          if ($env:VCToolsVersion -notlike '14.16.*') { throw "CUDA 10.2 requires the selected v141 compiler, got $env:VCToolsVersion" }
          if ($env:WindowsSDKVersion.TrimEnd('\') -ne '10.0.19041.0') { throw "Unexpected Windows SDK: $env:WindowsSDKVersion" }
          cl /Bv 2>&1 | Out-Host
          # cl without a source prints its version and exits nonzero.
          exit 0
      - name: Install CUDA on Windows
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          log-file-suffix: ${{ matrix.id }}.txt
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ matrix.python }}
      - name: Build Windows wheels with official source entrypoints
        if: runner.os == 'Windows'
        run: python scripts/build.py --spec spec.json --output dist
      - name: Use control-plane Python for publication
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Upload verified bundle to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish.py --spec spec.json
  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Publish only complete architecture groups
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish.py --finalize catalog.json
